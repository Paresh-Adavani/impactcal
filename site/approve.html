<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approve quotation — ImpactCal | ADONI TECH</title><link rel="icon" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="style.css?v=2">
<style>.line{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}.line .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px}.tot td{padding:3px 8px;border:0}.tot tr:last-child td{font-weight:700;border-top:2px solid var(--navy)}.dw{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}.dw input{width:auto}#main{padding-bottom:80px}.lim{color:#c0392b;font-weight:600}.okc{color:#1e8449}.box2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.box2 div{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.box2 b{display:block;font-size:17px;color:var(--navy)}.box2 span{font-size:12px;color:var(--muted)}.sticky{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--orange);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}</style>
</head><body>
<header><div class="wrap"><a href="index.html"><img src="img/logo.png" alt="ADONI TECH" class="brandmark"></a><div class="sub">ImpactCal<br><span id="subT">Quotation</span></div></div></header>
<div class="wrap" style="max-width:820px" id="main"><div class="card">Loading…</div></div>
<div class="sticky noprint" id="bar" hidden>
  <button class="btn ghost" id="save">Save changes</button>
  <a class="btn ghost" id="pdf" target="_blank" style="text-decoration:none">Preview PDF</a>
  <button class="btn ghost" id="self" hidden style="margin-left:auto">Download PDF &amp; send it myself</button><button class="btn" id="send">Send to customer</button>
</div>
<script src="common.js?v=5"></script>
<script>
const P = new URLSearchParams(location.search), ID = P.get('id'), T = P.get('t');
const hdr = () => T ? { 'x-approve-token': T } : {};
let D = null;
const n2 = v => Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ADMIN = () => D.access === 'admin';
async function load() {
  D = await api('approve/' + encodeURIComponent(ID), { headers: hdr() });
  render();
}
const netOf = i => Number(i.rate) * (1 - (Number(i.discount_pct) || 0) / 100);
function lineInfo(i, max) {
  if (!(i.kind === 'product' || i.kind === 'accessory') || !i.list_rate) return i.kind === 'extra' ? '<small class="muted">your own line (not billed by ADONI TECH)</small>' : '';
  const net = netOf(i), d = (1 - net / i.list_rate) * 100, floor = i.list_rate * (1 - max / 100);
  const over = d > max + 0.01;
  return `<small class="${over ? 'lim' : 'muted'}">list ${n2(i.list_rate)} · net ${n2(net)} · ${d >= 0 ? d.toFixed(1) + ' % below list' : (-d).toFixed(1) + ' % markup'}${over ? ` · beyond your ${max} % limit (floor ${n2(floor)})` : ''}</small>`;
}
function render() {
  const q = D.quotation, c = q.customer || {}, cur = q.currency, is = q.issuer || { type: 'adoni' };
  const sent = q.status === 'sent', admin = ADMIN(), L = D.limit || { violations: [] }, sp = q.special;
  const max = L.max_pct;
  $('#subT').textContent = admin ? 'Quotation approval' : is.type === 'dealer' ? 'Your quotation' : 'Quotation';
  const who = is.type === 'dealer' ? `<span class="pill ok">dealer ${esc(is.code)}</span> ${esc(is.company)}` : `<span class="pill">ADONI TECH · ${esc(is.office || 'satara')} office</span>${is.person ? ' · ' + esc(is.person.name) : ''}`;
  const specialBox = !sp ? '' : `<div class="note ${sp.status === 'approved' ? 'ok' : sp.status === 'declined' ? 'bad' : 'warn'}"><b>Special price ${esc(sp.status)}</b>${sp.requested_by ? ' · asked by ' + esc(sp.requested_by) : ''}${sp.reason ? ' — “' + esc(sp.reason) + '”' : ''}${sp.decided_by ? `<br>Decided by ${esc(sp.decided_by)}${sp.decision_note ? ': ' + esc(sp.decision_note) : ''}${sp.billing_discount_pct != null ? ` · dealer billed at list − ${sp.billing_discount_pct} % on this quotation` : ''}` : ''}
      ${admin && sp.status === 'pending' ? `<div class="grid" style="margin-top:8px"><div><label>Note to ${esc(sp.requested_by || 'requester')}</label><input id="sp_note"></div>${is.type === 'dealer' ? `<div><label>Bill dealer at list − % (this quotation)</label><input id="sp_bill" type="number" step="any" value="${Math.max(is.billing_discount_pct || 25, Math.ceil(Math.max(0, ...L.violations.map(v => v.discount_pct)) + 5))}"></div>` : ''}</div>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="sp_ok">Approve special price</button><button class="btn sm ghost" id="sp_no">Decline</button></div>` : ''}</div>`;
  const mk = L.violations.filter(v => v.kind === 'markup'), dc = L.violations.filter(v => v.kind !== 'markup');
  const limitBox = !L.violations.length || L.special_approved ? '' : `<div class="note ${admin ? 'blue' : 'bad'}">${dc.length ? `<b>${dc.length} line(s) beyond the ${max} % discount limit</b>: ${dc.map(v => `${esc(v.model)} ${v.discount_pct} %`).join(', ')}. ` : ''}${mk.length ? `<b>${mk.length} line(s) above list price</b> (${mk.map(v => esc(v.model)).join(', ')}) — a markup on an ADONI TECH quotation needs approval. ` : ''}
      ${admin ? ' As admin you can still send it.' : (sp && sp.status === 'pending' ? ' Waiting for ADONI TECH to decide the special price.' : ` Change the price, or ask ADONI TECH for approval (e.g. OEM volume, project pricing):
      <div style="margin-top:8px"><textarea id="sp_reason" rows="2" placeholder="Why a special price? e.g. OEM, 40 nos per year, competitor price …"></textarea><button class="btn sm" id="sp_req" style="margin-top:6px">Request approval</button></div>`)}</div>`;
  const b = D.billing;
  const billBox = !b ? '' : `<div class="card"><h3>${admin ? 'Billing to dealer' : 'Your margin'}</h3><div class="box2"><div><span>List value</span><b>${cur} ${n2(b.list_value)}</b></div><div><span>Price to customer (before GST)</span><b>${cur} ${n2(b.customer_value)}</b></div><div><span>ADONI TECH bills ${admin ? 'dealer' : 'you'} (list − ${b.billing_discount_pct} %${b.special_billing ? ', special' : ''})</span><b>${cur} ${n2(b.billing_value)}</b></div><div><span>${admin ? 'Dealer' : 'Your'} margin</span><b class="${b.dealer_margin < 0 ? 'lim' : 'okc'}">${cur} ${n2(b.dealer_margin)}</b></div></div><p class="hint">Billing excludes freight, packing and your own extra lines. GST as applicable on ADONI TECH's invoice.</p></div>`;
  const canSend = admin || D.access === 'dealer' || D.sales_self_send;
  $('#main').innerHTML = `
  <div class="card">
    <div class="spread"><h3>${esc(q.number)}${q.rev ? ' rev ' + q.rev : ''} <span class="pill ${sent ? 'ok' : 'brand'}">${esc(q.status)}</span></h3><span class="muted">${esc(q.date)} · ${cur}${q.fx ? ` @ ${q.fx.inr_per_usd.toFixed(2)} ₹/$ +${q.fx.uplift_pct}%` : ''}</span></div>
    <p style="margin:4px 0 8px">${who}${D.actor ? ` <small class="muted">· you: ${esc(D.actor.name || D.actor.email)}</small>` : ''}</p>
    ${sent ? `<div class="note ok">Sent to ${esc(q.sent_to)} on ${new Date(q.sent_at).toLocaleString('en-IN')}. Sending again mails the customer again.</div>` : ''}
    ${q.items.some(i => !i.rate) ? `<div class="note warn">Some lines have no price in the database — enter a rate below before sending.</div>` : ''}
    ${specialBox}${limitBox}
    <table class="kv"><tr><td class="muted">Customer</td><td><b>${esc(c.company || c.name)}</b> · ${esc(c.contact || '')}<br>${esc(c.email || '')} · ${esc(c.phone || '')}<br>${esc([c.city, c.state_name, c.country].filter(Boolean).join(', '))}${c.gstin ? ' · GSTIN ' + esc(c.gstin) : ''}</td></tr>
    <tr><td class="muted">Project</td><td>${esc((q.project || {}).name || '')} ${(q.project || {}).equipment ? '· ' + esc(q.project.equipment) : ''} · RFQ ${esc(q.rfq_number)}${q.raised_by ? ' · raised by ' + esc(q.raised_by.name || q.raised_by.email) : ''}</td></tr>
    ${D.rfq && D.rfq.selection && D.rfq.selection.summary ? `<tr><td class="muted">Calculation</td><td>${Object.entries(D.rfq.selection.summary).map(([k, v]) => `<span class="pill">${esc(k)}: ${esc(v)}</span>`).join(' ')}</td></tr>` : ''}
    ${D.rfq && D.rfq.message ? `<tr><td class="muted">Message</td><td>${esc(D.rfq.message)}</td></tr>` : ''}
    ${D.offices && D.offices.length && is.type !== 'dealer' ? `<tr><td class="muted">Billing office</td><td><select id="office" style="width:auto">${D.offices.map(o => `<option value="${esc(o.id)}" ${o.id === is.office ? 'selected' : ''}>${esc(o.label)}${o.ready ? '' : ' (address not set — prints Satara)'}</option>`).join('')}</select></td></tr>` : ''}</table>
  </div>
  <div class="card"><h3>Lines</h3>
    ${admin ? '' : is.type === 'dealer' ? `<p class="hint">Rate = your price to the customer. Give a discount (up to ${max} % below list) or raise the rate for your markup. List prices, HSN and GST come from the ADONI TECH database.</p>` : `<p class="hint">You may send on your own at list price or up to ${max} % below list. A deeper discount or a price above list goes to Paresh for approval.</p>`}
    <div id="lines">${q.items.map((i, k) => `<div class="line" data-k="${k}"><b>${esc(i.model)}</b> <span class="muted">${esc(i.description)}</span><br>${lineInfo(i, max)}
      <div class="g"><div><label>Qty</label><input data-f="qty" type="number" step="any" value="${i.qty}"></div><div><label>Rate ${cur}</label><input data-f="rate" type="number" step="any" value="${i.rate}"></div><div><label>Disc %</label><input data-f="discount_pct" type="number" step="any" value="${i.discount_pct}"></div><div><label>GST %</label><input data-f="gst_rate" type="number" value="${i.gst_rate}" ${admin ? '' : 'disabled'}></div><div><label>Lead time d</label><input data-f="lead_time_days" type="number" value="${i.lead_time_days ?? ''}"></div><div><label>HSN</label><input data-f="hsn" value="${esc(i.hsn)}" ${admin ? '' : 'disabled'}></div></div></div>`).join('')}</div>
    <div class="grid" style="margin-top:8px"><div><label>Freight ${cur}</label><input id="freight" type="number" step="any" value="${q.freight || 0}"></div><div><label>Packing ${cur}</label><input id="packing" type="number" step="any" value="${q.packing || 0}"></div><div><label>Valid days</label><input id="valid" type="number" value="${q.valid_days}"></div>
      ${cur === 'INR' ? `<div><label>Place of supply</label><select id="pos">${Object.entries(STATES()).map(([k, v]) => `<option value="${k}" ${k === q.place_of_supply_code ? 'selected' : ''}>${k} ${esc(v)}</option>`).join('')}</select></div>` : ''}</div>
    <div style="margin-top:8px"><label>Notes to customer (printed on the quotation)</label><textarea id="notes" rows="2">${esc(q.notes || '')}</textarea></div>
    <div class="grid" style="margin-top:8px"><div><label>Payment terms</label><textarea id="t_payment" rows="2">${esc(q.terms.payment || '')}</textarea></div><div><label>Delivery terms</label><textarea id="t_delivery" rows="2">${esc(q.terms.delivery || '')}</textarea></div><div><label>Warranty</label><textarea id="t_warranty" rows="2">${esc(q.terms.warranty || '')}</textarea></div><div><label>Other</label><textarea id="t_other" rows="2">${esc(q.terms.other || '')}</textarea></div></div>
    <table class="tot" style="margin-top:12px;width:auto;margin-left:auto"><tr><td>Sub total</td><td class="n">${cur} ${n2(q.totals.sub_total)}</td></tr>${q.totals.discount_total ? `<tr><td>Discount</td><td class="n">- ${n2(q.totals.discount_total)}</td></tr>` : ''}<tr><td>Taxable</td><td class="n">${n2(q.totals.taxable)}</td></tr>
      ${q.supply_type === 'intra' ? `<tr><td>CGST</td><td class="n">${n2(q.totals.cgst)}</td></tr><tr><td>SGST</td><td class="n">${n2(q.totals.sgst)}</td></tr>` : q.supply_type === 'inter' ? `<tr><td>IGST</td><td class="n">${n2(q.totals.igst)}</td></tr>` : '<tr><td>Export</td><td class="n">zero-rated</td></tr>'}
      <tr><td>Grand total</td><td class="n">${cur} ${n2(q.totals.grand_total)}</td></tr></table>
    <p class="muted" style="font-size:12px">${esc(q.totals.amount_in_words)} · overall lead time ${q.lead_time_days || '—'} days</p>
  </div>
  ${billBox}
  ${admin ? `<div class="card"><h3>Drawings to send</h3>
    <p class="hint">GA drawings from the library that match the quoted models. Ticked PDFs are ${D.drawings_mode === 'attach' ? 'attached to the offer mail' : 'sent as expiring download links'}. Greyed ones are indexed but not yet uploaded.</p>
    ${D.drawings.length ? D.drawings.map(d => `<label class="dw"><input type="checkbox" data-path="${esc(d.path)}" ${(q.drawings || []).some(x => x.path === d.path) ? 'checked' : ''} ${d.available ? '' : 'disabled'}><span style="flex:1;${d.available ? '' : 'opacity:.5'}"><b>${esc(d.filename)}</b> <small class="muted">${esc([d.mounting, d.accessory, d.status].filter(Boolean).join(' · '))}${d.available ? '' : ' · <b>not uploaded yet</b> (Admin → Drawings)'}</small></span></label>`).join('') : '<div class="muted">No GA drawing indexed for these models.</div>'}
    <div class="row" style="margin-top:10px"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="radio" name="dm" value="attach" ${D.drawings_mode !== 'link' ? 'checked' : ''} style="width:auto">Attach PDFs</label><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="radio" name="dm" value="link" ${D.drawings_mode === 'link' ? 'checked' : ''} style="width:auto">Send expiring links</label></div>
  </div>` : `<div class="card"><p class="hint" style="margin:0">GA drawings are released by ADONI TECH on request — they are not attached to this mail.</p></div>`}
  <div class="card"><h3>${is.type === 'dealer' ? 'Letterhead &amp; bank on this quotation' : `Bank details on this quotation (${cur})`}</h3>
    ${is.type === 'dealer' ? `<p><b>${esc(D.company.name)}</b><br><small class="muted">${esc([D.company.addr1, D.company.addr2, D.company.city, D.company.pincode, D.company.state_name].filter(Boolean).join(', '))}${D.company.gstin ? ' · GSTIN ' + esc(D.company.gstin) : ''}</small></p>` : ''}
    ${Object.values(D.bank || {}).filter(Boolean).length ? `<table class="kv">${Object.entries(D.bank).filter(([k, v]) => v && k !== 'ad_code').map(([k, v]) => `<tr><td class="muted">${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>` : `<div class="note warn">${is.type === 'dealer' ? 'No bank details in your profile — the quotation prints without a bank block. Add them under Quote portal → My dealer profile.' : 'Bank details are empty — fill them in the admin panel (Settings) before sending.'}</div>`}
    ${admin ? `<div style="margin-top:10px"><label>Approved by</label><input id="by" value="${esc((D.actor && D.actor.name) || 'Paresh Adavani')}"></div>` : ''}</div>
  ${!canSend ? '<div class="note warn">Sales quotations are sent by ADONI TECH after approval (settings quote.sales_self_send = 0). Save your changes; Paresh has the approval link.</div>' : ''}
  <div id="out"></div>`;
  $('#bar').hidden = false;
  $('#send').hidden = !canSend;
  $('#self').hidden = D.access !== 'dealer';
  if (D.access !== 'dealer') $('#send').style.marginLeft = 'auto';
  $('#send').textContent = admin ? 'Approve & send to customer' : 'Send to customer';
  $('#pdf').href = `/api/approve/${encodeURIComponent(ID)}/pdf?` + (T ? 't=' + encodeURIComponent(T) : 'token=' + encodeURIComponent(AUTH.token));
  if ($('#sp_req')) $('#sp_req').onclick = async () => { try { await save(true); const r = await api(`approve/${encodeURIComponent(ID)}/special`, { method: 'POST', headers: hdr(), body: { reason: $('#sp_reason').value } }); await load(); $('#out').innerHTML = `<div class="note ok">Special-price request sent to ADONI TECH${r.mail ? '' : ' (mail could not be sent — it is saved; please call)'}. You will get an e-mail with the decision.</div>`; } catch (e) { alert(e.message); } };
  const decide = async decision => { try { const body = { decision, note: ($('#sp_note') || {}).value || '' }; if ($('#sp_bill')) body.billing_discount_pct = $('#sp_bill').value; await api(`approve/${encodeURIComponent(ID)}/special/decide`, { method: 'POST', headers: hdr(), body }); await load(); } catch (e) { alert(e.message); } };
  if ($('#sp_ok')) $('#sp_ok').onclick = () => decide('approve');
  if ($('#sp_no')) $('#sp_no').onclick = () => decide('decline');
}
function STATES() { return window.__ST || (window.__ST = { '27': 'Maharashtra', '24': 'Gujarat', '29': 'Karnataka', '33': 'Tamil Nadu', '07': 'Delhi', '06': 'Haryana', '09': 'Uttar Pradesh', '19': 'West Bengal', '36': 'Telangana', '37': 'Andhra Pradesh', '32': 'Kerala', '23': 'Madhya Pradesh', '08': 'Rajasthan', '03': 'Punjab', '05': 'Uttarakhand', '21': 'Odisha', '22': 'Chhattisgarh', '20': 'Jharkhand', '10': 'Bihar', '18': 'Assam', '30': 'Goa', '04': 'Chandigarh', '02': 'Himachal Pradesh', '01': 'Jammu and Kashmir', '26': 'Dadra and Nagar Haveli and Daman and Diu', '34': 'Puducherry' }); }
function collect() {
  const q = D.quotation;
  const items = $$('#lines .line').map(el => { const k = Number(el.dataset.k), o = { ...q.items[k] }; el.querySelectorAll('input[data-f]').forEach(i => { o[i.dataset.f] = i.value; }); return o; });
  const body = { items, freight: Number($('#freight').value) || 0, packing: Number($('#packing').value) || 0, valid_days: Number($('#valid').value) || 30, notes: $('#notes').value,
    terms: { payment: $('#t_payment').value, delivery: $('#t_delivery').value, warranty: $('#t_warranty').value, other: $('#t_other').value } };
  if (ADMIN()) body.drawings = $$('input[data-path]:checked').map(i => ({ path: i.dataset.path, filename: i.dataset.path.split('/').pop() }));
  if ($('#pos')) body.place_of_supply_code = $('#pos').value;
  if ($('#office')) body.office = $('#office').value;
  return body;
}
async function save(silent) { await api('approve/' + encodeURIComponent(ID), { method: 'PUT', headers: hdr(), body: collect() }); if (silent) { D = await api('approve/' + encodeURIComponent(ID), { headers: hdr() }); } else await load(); return D.quotation; }
$('#save').onclick = () => save().then(() => { $('#out').innerHTML = '<div class="note ok">Saved.</div>'; }).catch(e => alert(e.message));
$('#send').onclick = async () => {
  try {
    const q = await save(true);
    if (!ADMIN() && D.limit && !D.limit.ok) { render(); alert(`Discount beyond your ${D.limit.max_pct} % limit on ${D.limit.violations.map(v => v.model).join(', ')}. Raise the price or request a special price.`); return; }
    if (q.items.some(i => i.kind === 'product' && !i.rate)) { if (!confirm('Some product lines have ZERO rate - the customer would receive a quotation for 0. Send anyway?')) { render(); return; } }
    if (q.sent_at) { if (!confirm(`This quotation was already sent on ${new Date(q.sent_at).toLocaleString()} to ${q.sent_to || q.customer.email}. Send it AGAIN?`)) { render(); return; } }
    if (ADMIN()) { const notAvail = (q.drawings || []).filter(d => !(D.drawings || []).some(x => x.path === d.path && x.available)).map(d => d.filename);
      if (notAvail.length) { if (!confirm(`These drawings are ticked but not uploaded to the library yet, so they will NOT be attached: ${notAvail.join(', ')}. Send without them?`)) { render(); return; } } }
    if (!confirm(`${ADMIN() ? 'Approve' : 'Send'} ${q.number} for ${q.currency} ${n2(q.totals.grand_total)} and email it to ${q.customer.email}?`)) { render(); return; }
    $('#send').disabled = true; $('#send').textContent = 'Sending…';
    const r = await api('approve/' + encodeURIComponent(ID) + '/send', { method: 'POST', headers: hdr(), body: { approved_by: ($('#by') || {}).value, drawings_mode: (document.querySelector('input[name=dm]:checked') || {}).value } });
    await load();
    $('#out').innerHTML = r.ok ? `<div class="note ok"><b>Sent to ${esc(r.sent_to)}.</b>${r.attached.length ? ' Attached: ' + r.attached.join(', ') : ''}${r.links.length ? ' · links: ' + r.links.length : ''}${r.missing.length ? ' · not available: ' + r.missing.join(', ') : ''}${D.access === 'dealer' ? ' ADONI TECH has a copy.' : ''}</div>` : `<div class="note bad">Saved as approved, but the mail failed: ${esc(r.reason)}.</div>`;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  } catch (e) { alert(e.message); } finally { $('#send').disabled = false; $('#send').textContent = ADMIN() ? 'Approve & send to customer' : 'Send to customer'; }
};
$('#self').onclick = async () => {
  try {
    const q = await save(true);
    if (D.limit && !D.limit.ok) { render(); alert(`Discount beyond your ${D.limit.max_pct} % limit — change the price or request approval first.`); return; }
    if (!confirm(`Download ${q.number} as PDF to send from your own e-mail? It will be recorded as sent and ADONI TECH will be informed for billing.`)) return;
    const r = await api('approve/' + encodeURIComponent(ID) + '/send', { method: 'POST', headers: hdr(), body: { self_send: true } });
    const b = await fetch(`/api/approve/${encodeURIComponent(ID)}/pdf?token=${encodeURIComponent(AUTH.token)}`).then(x => x.blob());
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = q.number.replace(/\//g, '-') + '.pdf'; document.body.appendChild(a); a.click(); a.remove();
    await load(); $('#out').innerHTML = `<div class="note ok"><b>${esc(q.number)} downloaded.</b> Attach it to your own e-mail to ${esc(q.customer.email || 'the customer')}. It is marked as sent.</div>`;
  } catch (e) { alert(e.message); }
};
load().catch(e => {
  const next = 'approve.html' + location.search;
  $('#main').innerHTML = `<div class="card"><div class="note bad">${esc(e.message)}</div><p><a class="btn" href="login.html?next=${encodeURIComponent(next)}">Sign in</a> <span class="muted">with the e-mail that owns this quotation (dealer, ADONI TECH sales or admin).</span></p></div>`;
});
</script>
</body></html>
