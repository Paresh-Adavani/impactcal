[build]
  publish   = "site"
  functions = "netlify/functions"
  command   = "echo 'static site - nothing to build'"

[functions]
  node_bundler   = "zisi"
  # the CSV database and GA index travel with the function bundle
  included_files = ["data/*.csv", "site/img/logo.png", "node_modules/xlsx/**"]

[functions."drive-sync"]
  schedule = "@daily"

[[redirects]]
  from   = "/dealers"
  to     = "/dealer.html"
  status = 200

[[redirects]]
  from   = "/become-a-dealer"
  to     = "/dealer.html"
  status = 301

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/d/*"
  to     = "/.netlify/functions/api/d/:splat"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
